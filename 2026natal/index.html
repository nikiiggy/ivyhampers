        :root {
            --bg-cream: #FAF7F2;
            --card-cream: #FFFFFF;
            --text-dark: #33302E;
            --text-muted: #66605C;
            --accent-gold: #C5A059;
            --border-color: #E8E2D9;
            --wa-green: #25D366;
            --wa-green-hover: #20ba5a;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);

        * {

            margin: 0;
            padding: 0;
        }

        body {

            background-color: #EAE6DF;
            color: var(--text-dark);
            display: flex;
            justify-content: center;
        }

        .mobile-wrapper {

            max-width: 480px;
            background-color: var(--bg-cream);

            position: relative;
            padding-bottom: 90px;
        }

        /* Sticky Header Navigasi */

            top: 0;
            z-index: 1000;

            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;

            align-items: center;
            gap: 8px;
            color: var(--text-dark);
            font-size: 0.88rem;
            font-weight: 500;
            text-decoration: none;
            transition: var(--transition);

        .btn-back:hover {

        .header-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-dark);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .header-title span {
            color: var(--accent-gold);
        }

        /* Judul Halaman */
        .page-header {
            text-align: center;
            padding: 20px 16px 12px;
        }

        .page-header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            color: var(--text-dark);
            margin-bottom: 2px;
        }

        .page-header p {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        /* --- KATALOG CONTAINER 2 KOLOM --- */
        .catalog-grid {
            padding: 0 12px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .catalog-card {
            background-color: var(--card-cream);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            cursor: pointer;
            content-visibility: auto; /* Optimasi Rendering Browser */
            contain-intrinsic-size: 100px 200px;
            position: relative;
            aspect-ratio: 9 / 16;
        }

        .catalog-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .catalog-card:hover img {
            transform: scale(1.04);
        }

        /* LIGHTBOX MODAL (PREVIEW GAMBAR BESAR) */
        .lightbox-modal {
            display: none;
            position: fixed;
            z-index: 2000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            padding: 16px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .lightbox-modal.show {
            display: flex;
            opacity: 1;
        }

        .lightbox-content {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 8px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.5);
            object-fit: contain;
        }

        .lightbox-close {
            position: absolute;
            top: 16px;
            right: 16px;
            color: #FFFFFF;
            font-size: 24px;
            cursor: pointer;
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .lightbox-close:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        /* Floating Sticky Bar Bottom WA */
        .floating-wa-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background-color: var(--card-cream);
            padding: 12px 20px;
            border-top: 1px solid var(--border-color);
            box-shadow: 0 -4px 15px rgba(0,0,0,0.05);

            text-align: center;

        }

        footer span {

        }
    </style>
</head>

    <!-- JavaScript Lightbox -->
    <script>
        function openLightbox(imageSrc) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.src = imageSrc;
            lightbox.classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox(event) {
            if (event.target.id === 'lightbox' || event.target.classList.contains('lightbox-close')) {
                const lightbox = document.getElementById('lightbox');
                lightbox.classList.remove('show');
                document.body.style.overflow = 'auto';
            }
        }
    </script>
